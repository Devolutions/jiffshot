name: Trust test signing root
description: Retrieve and trust the authenticated Artifact Signing profile root for this runner.
inputs:
  endpoint:
    description: Azure Artifact Signing data-plane endpoint.
    required: true
  account_name:
    description: Artifact Signing account name.
    required: true
  profile_name:
    description: Artifact Signing certificate profile name.
    required: true
  certificate_path:
    description: Path where the downloaded DER root certificate is written.
    required: true
runs:
  using: composite
  steps:
    - name: Retrieve and install profile root
      shell: pwsh
      env:
        PSIGN_VERSION: 0.8.1
        PSIGN_SHA256: cb3637318189a8ec99fdd467e76731760025ee2e797768335894dbf27129bbb2
        TRUSTED_SIGNING_ENDPOINT: ${{ inputs.endpoint }}
        TRUSTED_SIGNING_ACCOUNT_NAME: ${{ inputs.account_name }}
        TRUSTED_SIGNING_PROFILE_NAME: ${{ inputs.profile_name }}
        CERTIFICATE_PATH: ${{ inputs.certificate_path }}
      run: |
        $ErrorActionPreference = 'Stop'
        $toolRoot = Join-Path $env:RUNNER_TEMP "psign-root-$env:PSIGN_VERSION"
        New-Item -ItemType Directory -Force -Path $toolRoot | Out-Null
        $archive = Join-Path $toolRoot 'psign-tool.zip'
        Invoke-WebRequest "https://github.com/Devolutions/psign/releases/download/v$env:PSIGN_VERSION/psign-tool-windows-x64.zip" -OutFile $archive
        $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
        if ($hash -ne $env:PSIGN_SHA256) { throw "psign download checksum mismatch: $hash" }
        Expand-Archive $archive -DestinationPath $toolRoot -Force
        $tool = Join-Path $toolRoot 'psign-tool.exe'
        if (-not (Test-Path -LiteralPath $tool -PathType Leaf)) { throw "psign tool is missing: $tool" }

        $accessToken = az account get-access-token `
          --scope https://codesigning.azure.net/.default --query accessToken --output tsv
        if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($accessToken)) {
          throw 'Failed to acquire an Artifact Signing access token.'
        }
        Write-Output "::add-mask::$accessToken"

        $certificatePath = [IO.Path]::GetFullPath($env:CERTIFICATE_PATH)
        New-Item -ItemType Directory -Force -Path (Split-Path -Parent $certificatePath) | Out-Null
        & $tool artifact-signing-root `
          --endpoint $env:TRUSTED_SIGNING_ENDPOINT `
          --account-name $env:TRUSTED_SIGNING_ACCOUNT_NAME `
          --profile-name $env:TRUSTED_SIGNING_PROFILE_NAME `
          --access-token $accessToken `
          --output $certificatePath
        if ($LASTEXITCODE -ne 0) { throw 'Failed to retrieve the Artifact Signing profile root.' }

        $certificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new($certificatePath)
        $constraints = $certificate.Extensions |
          Where-Object { $_.Oid.Value -eq '2.5.29.19' } |
          Select-Object -First 1
        if ($null -eq $constraints -or -not $constraints.CertificateAuthority -or $certificate.Subject -ne $certificate.Issuer) {
          throw 'The downloaded Artifact Signing certificate is not a self-signed CA root.'
        }
        Import-Certificate -FilePath $certificatePath -CertStoreLocation 'Cert:\CurrentUser\Root' |
          Out-Null
        $trustedRoot = Get-ChildItem 'Cert:\CurrentUser\Root' |
          Where-Object { $_.Thumbprint -eq $certificate.Thumbprint } |
          Select-Object -First 1
        if ($null -eq $trustedRoot) { throw 'The Artifact Signing profile root was not installed.' }
        Write-Output "Trusted test-signing root: $($certificate.Subject) ($($certificate.Thumbprint))"
