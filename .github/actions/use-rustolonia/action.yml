name: Use pinned Rustolonia host
description: Stage the version-matched host archives from the pinned Rustolonia release.
inputs:
  rid:
    description: Target NativeAOT runtime identifier.
    required: true
runs:
  using: composite
  steps:
    - name: Verify and stage both host linkages
      shell: pwsh
      env:
        HOST_RID: ${{ inputs.rid }}
      run: |
        $ErrorActionPreference = 'Stop'
        Import-Module ./package/RustoloniaHost.psm1 -Force
        $manifest = (Resolve-Path ./Cargo.toml).Path
        $null = Get-JiffshotRustoloniaRevision -Manifest $manifest
        $version = Get-JiffshotRustoloniaVersion -Manifest $manifest
        $root = Join-Path $env:RUNNER_TEMP 'jiffshot-rustolonia'
        $archives = Join-Path $env:RUNNER_TEMP 'rustolonia-archives'
        [void][IO.Directory]::CreateDirectory($archives)
        $release = "https://github.com/Devolutions/rustolonia/releases/download/v$version"
        $checksums = Join-Path $archives 'SHA256SUMS'
        Invoke-WebRequest -Uri "$release/SHA256SUMS" -OutFile $checksums
        $checksumLines = Get-Content -LiteralPath $checksums
        foreach ($linkage in 'Shared', 'Static') {
          $suffix = if ($linkage -eq 'Static') { '-static' } else { '' }
          $name = "rustolonia-host-$version-$($env:HOST_RID)$suffix.tar.gz"
          $expected = [regex]::Match(($checksumLines -join "`n"), "(?m)^(?<hash>[a-f0-9]{64})\s+\*?$([regex]::Escape($name))$")
          if (-not $expected.Success) { throw "Rustolonia release checksum is missing $name" }
          $archive = Join-Path $archives $name
          Invoke-WebRequest -Uri "$release/$name" -OutFile $archive
          "$($expected.Groups['hash'].Value)  $name" |
            Set-Content -LiteralPath "$archive.sha256" -NoNewline
          $destination = Join-Path $root $linkage.ToLowerInvariant()
          Expand-JiffshotRustoloniaHost -Archive $archive -Destination $destination `
            -Rid $env:HOST_RID -Linkage $linkage -Version $version
          $variable = if ($linkage -eq 'Static') { 'RUSTOLONIA_STATIC_HOST_DIR' } else { 'RUSTOLONIA_HOST_DIR' }
          "$variable=$destination" | Out-File -LiteralPath $env:GITHUB_ENV -Encoding utf8 -Append
        }
