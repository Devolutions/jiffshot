name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Version to stamp and verify on built binaries; defaults to Cargo.toml
        type: string
        default: ''
      signing_environment:
        description: GitHub environment for signing; empty produces unsigned CI artifacts
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.rid }}
    environment:
      name: ${{ inputs.signing_environment || '' }}
    permissions:
      contents: read
      id-token: write
    # win-arm64 is cross-built on x64 (Visual Studio's ARM64 tools are on the
    # image), so it is built but not run.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            target: x86_64-pc-windows-msvc
            test: true
          - rid: win-arm64
            target: aarch64-pc-windows-msvc
            test: false
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        shell: pwsh
        run: |
          # rust-toolchain.toml selects the channel; rustup installs it here.
          rustup show
          rustup target add ${{ matrix.target }}
          cargo --version
          rustc --version

      - name: Cache Cargo and the Rustolonia host
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/AppData/Local/rustolonia/host
            target
          key: ${{ matrix.rid }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ matrix.rid }}-

      - name: Build
        env:
          JIFFSHOT_VERSION: ${{ inputs.version }}
        run: cargo build --release --locked -p jiffshot -p jiffshot-cli --target ${{ matrix.target }}

      - name: Test
        if: matrix.test
        env:
          JIFFSHOT_VERSION: ${{ inputs.version }}
        run: cargo test --release --locked --workspace --target ${{ matrix.target }}

      - name: Agent CLI artifact workflow
        if: matrix.test
        shell: pwsh
        run: |
          $env:JIFFSHOT_CLI_E2E = Join-Path (Get-Location) 'target\${{ matrix.target }}\release\jiffshot-cli.exe'
          cargo test --release --locked -p jiffshot-workflow --target ${{ matrix.target }} cli_edits_artifacts_over_real_ipc_without_desktop_input -- --ignored --test-threads=1

      - name: Package
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          # The build script puts the Rustolonia host next to jiffshot.exe.
          $out = "target/${{ matrix.target }}/release"
          $dir = "jiffshot-${{ matrix.rid }}"
          New-Item -ItemType Directory -Path $dir | Out-Null
          Copy-Item "$out/jiffshot.exe", "$out/jiffshot-cli.exe", "$out/*.dll", "app/README-portable.txt" -Destination $dir
          $cargoToml = Get-Content -LiteralPath Cargo.toml -Raw
          if ($cargoToml -notmatch '(?ms)^\[workspace\.package\].*?^\s*version\s*=\s*"(?<v>[0-9]+\.[0-9]+\.[0-9]+)"') {
            throw 'Could not read [workspace.package] version from Cargo.toml'
          }
          $workspaceVersion = $Matches['v']
          $expectedVersion = if ([string]::IsNullOrWhiteSpace($env:EXPECTED_VERSION)) {
            $workspaceVersion
          } elseif ($env:EXPECTED_VERSION -ne $workspaceVersion) {
            throw "Input version '$env:EXPECTED_VERSION' does not match Cargo.toml '$workspaceVersion'"
          } else {
            $env:EXPECTED_VERSION
          }
          $expectedFileVersion = "$expectedVersion.0"
          $exeInfo = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path "$dir/jiffshot.exe"))
          if ($exeInfo.CompanyName -ne 'Devolutions Inc.') {
            throw "jiffshot.exe CompanyName '$($exeInfo.CompanyName)' does not match 'Devolutions Inc.'"
          }
          if ($exeInfo.ProductName -ne 'Devolutions Jiffshot') {
            throw "jiffshot.exe ProductName '$($exeInfo.ProductName)' does not match 'Devolutions Jiffshot'"
          }
          if ([string]::IsNullOrWhiteSpace($exeInfo.FileDescription)) {
            throw 'jiffshot.exe is missing FileDescription'
          }
          if ($exeInfo.OriginalFilename -ne 'jiffshot.exe') {
            throw "jiffshot.exe OriginalFilename '$($exeInfo.OriginalFilename)' does not match 'jiffshot.exe'"
          }
          if ($exeInfo.FileVersion -ne $expectedFileVersion) {
            throw "jiffshot.exe FileVersion '$($exeInfo.FileVersion)' does not match '$expectedFileVersion'"
          }
          if ($exeInfo.ProductVersion -ne $expectedVersion) {
            throw "jiffshot.exe ProductVersion '$($exeInfo.ProductVersion)' does not match '$expectedVersion'"
          }
          if ($cargoToml -notmatch 'rustolonia\s*=\s*\{[^}]*tag\s*=\s*"v(?<rv>[0-9]+\.[0-9]+\.[0-9]+)"') {
            throw 'Could not read rustolonia tag from Cargo.toml'
          }
          $rustoloniaVersion = $Matches['rv']
          $hostInfo = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path "$dir/rustolonia_host.dll"))
          if ($hostInfo.FileVersion -ne "$rustoloniaVersion.0") {
            throw "rustolonia_host.dll FileVersion '$($hostInfo.FileVersion)' does not match '$rustoloniaVersion.0'"
          }
          if (-not $hostInfo.ProductVersion.StartsWith($rustoloniaVersion)) {
            throw "rustolonia_host.dll ProductVersion '$($hostInfo.ProductVersion)' does not start with '$rustoloniaVersion'"
          }
          Write-Host "Version OK: jiffshot.exe FileVersion=$($exeInfo.FileVersion) ProductVersion=$($exeInfo.ProductVersion); rustolonia_host.dll FileVersion=$($hostInfo.FileVersion)"
          Get-ChildItem $dir | Format-Table Name, Length

      - name: Sign portable binaries
        if: github.event_name != 'pull_request' && inputs.signing_environment != ''
        uses: ./.github/actions/sign
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.TRUSTED_SIGNING_ACCOUNT_NAME }}
          TRUSTED_SIGNING_PROFILE_NAME: ${{ secrets.TRUSTED_SIGNING_PROFILE_NAME }}
          TRUSTED_SIGNING_TIMESTAMP_SERVER: ${{ vars.TRUSTED_SIGNING_TIMESTAMP_SERVER || 'http://timestamp.acs.microsoft.com/' }}
        with:
          install_test_signing_root: ${{ inputs.signing_environment == 'publish-test' }}
          files: |
            jiffshot-${{ matrix.rid }}\jiffshot.exe
            jiffshot-${{ matrix.rid }}\jiffshot-cli.exe
            jiffshot-${{ matrix.rid }}\rustolonia_host.dll

      - uses: actions/upload-artifact@v7
        with:
          name: jiffshot-${{ matrix.rid }}
          path: jiffshot-${{ matrix.rid }}
          if-no-files-found: error

  linux:
    name: linux-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            machine: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            machine: aarch64
    env:
      CARGO_TERM_COLOR: always
      JIFFSHOT_VERSION: ${{ inputs.version }}
      JIFFSHOT_TEST_ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7

      - name: Assert native runner architecture
        run: test "$(uname -m)" = "${{ matrix.machine }}"

      - name: Install Linux build and media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            clang \
            gcc \
            libclang-dev \
            libleptonica-dev \
            libtesseract-dev \
            tesseract-ocr-eng \
            pkg-config \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-tools \
            gstreamer1.0-pipewire \
            gstreamer1.0-pulseaudio \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-ugly \
            gstreamer1.0-libav \
            dpkg-dev \
            desktop-file-utils \
            xvfb \
            x11-utils \
            xclip \
            libxtst6 \
            libgtk-3-0t64 \
            dbus

      - name: Set up PowerShell and Pester
        uses: ./.github/actions/setup-pwsh

      - name: Set up Rust
        run: |
          rustup show
          rustup component add clippy
          cargo --version
          rustc --version

      - name: Cache Cargo and the Rustolonia host
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cache/rustolonia/host
            target
          key: ubuntu2404-linux-${{ matrix.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ubuntu2404-linux-${{ matrix.arch }}-

      - name: Test
        run: cargo test --release --locked --workspace

      - name: Lint Linux app
        run: cargo clippy --locked --no-deps -p jiffshot --all-targets -- -D warnings

      - name: Build Linux app
        run: cargo build --release --locked -p jiffshot

      - name: Test Linux global shortcut portal integration
        run: |
          dbus-run-session -- pwsh -NoProfile -File app/tests/linux_shortcuts_e2e.ps1 \
            -Binary target/release/jiffshot -RuntimeDir target/release

      - name: Test Linux editor responsiveness
        run: |
          dbus-run-session -- pwsh -NoProfile -File app/tests/linux_load_e2e.ps1 \
            -Binary target/release/jiffshot -RuntimeDir target/release

      - name: Test Linux export dialog
        run: |
          dbus-run-session -- pwsh -NoProfile -File app/tests/linux_export_e2e.ps1 \
            -Binary target/release/jiffshot -RuntimeDir target/release

      - name: Test Linux native file picker fallback
        run: |
          dbus-run-session -- pwsh -NoProfile -File app/tests/linux_file_dialog_fallback_e2e.ps1 \
            -Binary target/release/jiffshot -RuntimeDir target/release

      - name: Test Linux interactive editor effects
        run: |
          dbus-run-session -- pwsh -NoProfile -File app/tests/linux_interactive_effects_e2e.ps1 \
            -Binary target/release/jiffshot -RuntimeDir target/release

      - name: Test Linux video GIF export
        run: |
          dbus-run-session -- pwsh -NoProfile -File app/tests/linux_video_export_e2e.ps1 \
            -Binary target/release/jiffshot -RuntimeDir target/release

      - name: Test Linux saved-capture sharing
        run: |
          dbus-run-session -- pwsh -NoProfile -File app/tests/linux_share_e2e.ps1 \
            -Binary target/release/jiffshot -RuntimeDir target/release

      - name: Test Linux webcam preferences
        run: |
          dbus-run-session -- pwsh -NoProfile -File app/tests/linux_webcam_e2e.ps1 \
            -Binary target/release/jiffshot -RuntimeDir target/release

      - name: Test Linux recording frame-rate GUI
        run: |
          dbus-run-session -- pwsh -NoProfile -File app/tests/linux_recording_frame_rate_e2e.ps1 \
            -Binary target/release/jiffshot -RuntimeDir target/release

      - name: Test Linux interactive screenshots
        run: |
          dbus-run-session -- pwsh -NoProfile -File app/tests/linux_screenshot_e2e.ps1 \
            -Binary target/release/jiffshot -RuntimeDir target/release

      - name: Test Linux automatic capture copies
        run: |
          dbus-run-session -- pwsh -NoProfile -File app/tests/linux_automatic_copy_e2e.ps1 \
            -Binary target/release/jiffshot -RuntimeDir target/release

      - name: Test Linux screen text capture
        run: |
          dbus-run-session -- pwsh -NoProfile -File app/tests/linux_grab_text_e2e.ps1 \
            -Binary target/release/jiffshot -RuntimeDir target/release

      - name: Test Linux timed capture
        run: |
          dbus-run-session -- pwsh -NoProfile -File app/tests/linux_timed_capture_e2e.ps1 \
            -Binary target/release/jiffshot -RuntimeDir target/release

      - name: Test Linux screen capture presets
        run: |
          dbus-run-session -- pwsh -NoProfile -File app/tests/linux_screen_presets_e2e.ps1 \
            -Binary target/release/jiffshot -RuntimeDir target/release

      - name: Test Linux interval capture controls
        run: |
          dbus-run-session -- pwsh -NoProfile -File app/tests/linux_interval_e2e.ps1 \
            -Binary target/release/jiffshot -RuntimeDir target/release

      - name: Test Linux daily capture scheduling
        run: |
          dbus-run-session -- pwsh -NoProfile -File app/tests/linux_schedule_e2e.ps1 \
            -Binary target/release/jiffshot -RuntimeDir target/release

      - name: Test Linux tray and background capture
        run: |
          dbus-run-session -- pwsh -NoProfile -File app/tests/linux_tray_e2e.ps1 \
            -Binary target/release/jiffshot -RuntimeDir target/release

      - name: Test Linux login startup
        run: |
          dbus-run-session -- pwsh -NoProfile -File app/tests/linux_autostart_e2e.ps1 \
            -Binary target/release/jiffshot -RuntimeDir target/release

      - name: Package Ubuntu tar.gz and DEB
        run: pwsh -NoProfile -File package/linux/build.ps1 -Arch "${{ matrix.arch }}" -Format tar.gz,deb

      - name: Test Linux package builder and contents
        env:
          JIFFSHOT_TEST_FORMATS: tar.gz,deb
        run: pwsh -NoProfile -File package/linux/run-tests.ps1

      - name: Smoke-test the relocated portable package
        run: |
          mkdir -p "$RUNNER_TEMP/jiffshot portable"
          tar -xzf package/out/linux/*.tar.gz -C "$RUNNER_TEMP/jiffshot portable"
          launcher=$(find "$RUNNER_TEMP/jiffshot portable" -path '*/bin/jiffshot' -type f)
          pwsh -NoProfile -File package/linux/smoke.ps1 -Launcher "$launcher"

      - uses: actions/upload-artifact@v7
        with:
          name: jiffshot-linux-${{ matrix.arch }}
          path: package/out/linux/*
          if-no-files-found: error

  linux-rpm:
    name: linux-${{ matrix.arch }} Fedora RPM
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
            machine: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            machine: aarch64
    container: fedora:43
    env:
      CARGO_TERM_COLOR: always
      JIFFSHOT_VERSION: ${{ inputs.version }}
      JIFFSHOT_TEST_ARCH: ${{ matrix.arch }}
    steps:
      - name: Assert native Fedora container architecture
        run: test "$(uname -m)" = "${{ matrix.machine }}"

      - name: Install native Fedora build and packaging dependencies
        run: |
          dnf install --setopt=install_weak_deps=False -y \
            git tar gzip curl ca-certificates gcc-c++ clang-devel dnf5-plugins \
            leptonica-devel tesseract-devel pkgconf-pkg-config \
            gstreamer1-devel gstreamer1-plugins-base-devel \
            libicu binutils rpm-build cpio desktop-file-utils
          # Enable this before installing libav/FFmpeg, which can require OpenH264.
          dnf config-manager setopt fedora-cisco-openh264.enabled=1
          dnf install --setopt=install_weak_deps=False -y \
            gstreamer1-plugins-base gstreamer1-plugins-good \
            gstreamer1-plugins-bad-free gstreamer1-plugin-libav ffmpeg-free \
            pipewire-gstreamer tesseract tesseract-langpack-eng \
            fontconfig dejavu-sans-fonts

      - name: Enable Fedora 43 RPM Fusion media codecs
        run: |
          test "$(rpm -E %fedora)" = 43
          dnf install --setopt=install_weak_deps=False -y \
            https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-43.noarch.rpm
          # Follow RPM Fusion's supported full-codec swap, not Fedora's limited build.
          dnf swap --setopt=install_weak_deps=False -y ffmpeg-free ffmpeg --allowerasing
          dnf install --setopt=install_weak_deps=False -y \
            gstreamer1-plugins-ugly gstreamer1-plugins-bad-freeworld

      - name: Verify Fedora media and OCR dependency providers
        run: |
          # Fedora 43 supplies fdkaacenc; the shared app selector keeps voaacenc
          # first on Ubuntu. Require the real Fedora provider, never an encoder alias.
          # Workspace media tests also encode, parse and decode the selected AAC.
          for element in jpegenc pngenc mp4mux x264enc h264parse aacparse \
            fdkaacenc avdec_h264 avdec_aac pipewiresrc pulsesrc audiomixer; do
            gst-inspect-1.0 --exists "$element"
          done
          languages=$(tesseract --list-langs)
          printf '%s\n' "$languages" | grep -Fx eng
          family=$(fc-match -f '%{family}\n' 'DejaVu Sans')
          printf '%s\n' "$family" | grep -Fx 'DejaVu Sans'

      - uses: actions/checkout@v7

      - name: Set up PowerShell and Pester
        uses: ./.github/actions/setup-pwsh

      - name: Set up Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs |
            sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" show

      - name: Cache Cargo and the Rustolonia host
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cache/rustolonia/host
            target
          key: fedora43-linux-${{ matrix.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: fedora43-linux-${{ matrix.arch }}-

      - name: Test against native Fedora runtime libraries
        run: cargo test --release --locked --workspace

      - name: Build against Fedora runtime libraries
        run: cargo build --release --locked -p jiffshot

      - name: Package native Fedora RPM
        run: pwsh -NoProfile -File package/linux/build.ps1 -Arch "${{ matrix.arch }}" -Format rpm -OutputDir package/out/linux-rpm

      - name: Test RPM builder and contents
        env:
          JIFFSHOT_TEST_FORMATS: rpm
          JIFFSHOT_PACKAGE_DIR: package/out/linux-rpm
        run: pwsh -NoProfile -File package/linux/run-tests.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: jiffshot-linux-${{ matrix.arch }}-rpm
          path: package/out/linux-rpm/*
          if-no-files-found: error

  linux-package-install:
    name: Install Linux packages (${{ matrix.arch }}, ${{ matrix.format }})
    needs: [linux, linux-rpm]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: deb
            arch: x64
            runner: ubuntu-24.04
            machine: x86_64
            package_arch: amd64
            image: ubuntu:24.04
            artifact: jiffshot-linux-x64
          - format: rpm
            arch: x64
            runner: ubuntu-24.04
            machine: x86_64
            package_arch: x86_64
            image: fedora:43
            artifact: jiffshot-linux-x64-rpm
          - format: deb
            arch: arm64
            runner: ubuntu-24.04-arm
            machine: aarch64
            package_arch: arm64
            image: ubuntu:24.04
            artifact: jiffshot-linux-arm64
          - format: rpm
            arch: arm64
            runner: ubuntu-24.04-arm
            machine: aarch64
            package_arch: aarch64
            image: fedora:43
            artifact: jiffshot-linux-arm64-rpm
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: package/out/install

      - name: Download PowerShell for the clean install container
        uses: ./.github/actions/setup-pwsh
        with:
          install-dir: ${{ runner.temp }}/powershell
          force: 'true'
          link: 'false'
          pester: 'false'

      - name: Clean install, desktop registration, launch, and uninstall
        run: |
          test "$(uname -m)" = "${{ matrix.machine }}"
          docker run --rm --volume "$PWD:/work:ro" \
            --volume "$RUNNER_TEMP/powershell:/opt/microsoft/powershell/7:ro" "${{ matrix.image }}" \
            bash -ceu '
              test "$(uname -m)" = "$2"
              cd /work/package/out/install
              sha256sum --check "SHA256SUMS-linux-$4.txt"
              if [ "$1" = deb ]; then
                apt-get update -qq
                apt-get install --no-install-recommends -y \
                  /work/package/out/install/*.deb libicu74 xvfb x11-utils
                test "$(dpkg-query -W -f=\${Architecture} jiffshot)" = "$3"
              else
                dnf install --setopt=install_weak_deps=False -y \
                  /work/package/out/install/*.rpm libicu /usr/bin/Xvfb /usr/bin/xwininfo
                test "$(rpm -q --queryformat "%{ARCH}" jiffshot)" = "$3"
              fi
              ln -s /opt/microsoft/powershell/7/pwsh /usr/local/bin/pwsh
              pwsh -NoProfile -File /work/package/linux/validate-installed.ps1 -Arch "$4"
              grep -F "application/x-jiffshot=" /usr/share/applications/mimeinfo.cache
              grep -F "application/x-jiffshot" /usr/share/mime/globs2
              pwsh -NoProfile -File /work/package/linux/smoke.ps1 -Launcher /usr/bin/jiffshot
              mkdir -p /root/.config/Jiffshot
              touch /root/.config/Jiffshot/package-removal-sentinel
              if [ "$1" = deb ]; then
                apt-get remove -y jiffshot
              else
                rpm -V jiffshot
                dnf remove -y jiffshot
              fi
              test ! -e /usr/bin/jiffshot
              test ! -e /usr/share/applications/com.devolutions.Jiffshot.desktop
              test -e /root/.config/Jiffshot/package-removal-sentinel
            ' -- "${{ matrix.format }}" "${{ matrix.machine }}" "${{ matrix.package_arch }}" "${{ matrix.arch }}"

  msi:
    name: ${{ matrix.rid }} MSI
    environment:
      name: ${{ inputs.signing_environment || '' }}
    permissions:
      contents: read
      id-token: write
    needs: build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            platform: x64
            test: true
          - rid: win-arm64
            platform: arm64
            test: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: jiffshot-${{ matrix.rid }}
          path: bin

      - name: Install WiX Toolset
        shell: pwsh
        run: |
          winget install --id WiXToolset.WiXCLI --version 5.0.2.0 --exact --source winget `
            --accept-source-agreements --accept-package-agreements
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wixDir = Join-Path $env:ProgramFiles 'WiX Toolset v5.0\bin'
          $wixExe = Join-Path $wixDir 'wix.exe'
          if (-not (Test-Path -LiteralPath $wixExe -PathType Leaf)) {
            throw "WiX CLI was not installed at $wixExe"
          }
          $wixVersion = (& $wixExe --version).Trim()
          if ($LASTEXITCODE -ne 0 -or $wixVersion -notmatch '^5\.0\.2(?:\b|[+-])') {
            throw "Expected WiX CLI 5.0.2, got '$wixVersion'"
          }
          $wixDir >> $env:GITHUB_PATH

      - name: Build the MSI
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $cargoToml = Get-Content -LiteralPath Cargo.toml -Raw
          if ($cargoToml -notmatch '(?ms)^\[workspace\.package\].*?^\s*version\s*=\s*"(?<v>[0-9]+\.[0-9]+\.[0-9]+)"') {
            throw 'Could not read [workspace.package] version from Cargo.toml'
          }
          $expectedVersion = if ([string]::IsNullOrWhiteSpace($env:EXPECTED_VERSION)) {
            $Matches['v']
          } elseif ($env:EXPECTED_VERSION -ne $Matches['v']) {
            throw "Input version '$env:EXPECTED_VERSION' does not match Cargo.toml '$($Matches['v'])'"
          } else {
            $env:EXPECTED_VERSION
          }
          dotnet build package -c Release -p:Version=$expectedVersion
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pkgExe = Resolve-Path 'package/bin/Release/net472/Jiffshot.Package.exe'
          $pkgInfo = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($pkgExe)
          if ($pkgInfo.CompanyName -ne 'Devolutions Inc.') {
            throw "Jiffshot.Package.exe CompanyName '$($pkgInfo.CompanyName)' does not match 'Devolutions Inc.'"
          }
          if ($pkgInfo.ProductName -ne 'Devolutions Jiffshot') {
            throw "Jiffshot.Package.exe ProductName '$($pkgInfo.ProductName)' does not match 'Devolutions Jiffshot'"
          }
          if ($pkgInfo.FileVersion -ne "$expectedVersion.0") {
            throw "Jiffshot.Package.exe FileVersion '$($pkgInfo.FileVersion)' does not match '$expectedVersion.0'"
          }
          if (-not $pkgInfo.ProductVersion.StartsWith($expectedVersion)) {
            throw "Jiffshot.Package.exe ProductVersion '$($pkgInfo.ProductVersion)' does not start with '$expectedVersion'"
          }
          & $pkgExe -bin bin -platform ${{ matrix.platform }} -version $expectedVersion -out msi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem msi | Format-Table Name, Length

      - name: Sign MSI
        if: github.event_name != 'pull_request' && inputs.signing_environment != ''
        uses: ./.github/actions/sign
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.TRUSTED_SIGNING_ACCOUNT_NAME }}
          TRUSTED_SIGNING_PROFILE_NAME: ${{ secrets.TRUSTED_SIGNING_PROFILE_NAME }}
          TRUSTED_SIGNING_TIMESTAMP_SERVER: ${{ vars.TRUSTED_SIGNING_TIMESTAMP_SERVER || 'http://timestamp.acs.microsoft.com/' }}
        with:
          install_test_signing_root: ${{ inputs.signing_environment == 'publish-test' }}
          files: msi\*.msi

      - name: Install and uninstall
        if: matrix.test
        shell: pwsh
        env:
          SIGNING_ENVIRONMENT: ${{ inputs.signing_environment }}
        run: |
          $msi = (Get-ChildItem msi/*.msi).FullName
          $exe = "$env:ProgramFiles\Devolutions\Jiffshot\jiffshot.exe"
          $hostDll = "$env:ProgramFiles\Devolutions\Jiffshot\rustolonia_host.dll"
          $cli = "$env:ProgramFiles\Devolutions\Jiffshot\jiffshot-cli.exe"
          function Invoke-Msiexec($arguments) {
            $p = Start-Process msiexec.exe -ArgumentList $arguments -Wait -PassThru
            if ($p.ExitCode -ne 0) { Get-Content msiexec.log -Tail 50; throw "msiexec $arguments exited with $($p.ExitCode)" }
          }
          Invoke-Msiexec "/i `"$msi`" /qn /l*v msiexec.log"
          if (-not (Test-Path $exe)) { throw "$exe is missing" }
          if (-not (Test-Path $hostDll)) { throw "the Rustolonia host is missing" }
          if (-not (Test-Path $cli)) { throw "$cli is missing" }
          # With no Jiffshot running, the CLI reports it as unavailable (exit code 3).
          $reply = & $cli status --no-launch | ConvertFrom-Json
          if ($LASTEXITCODE -ne 3 -or $reply.error.code -ne 'unavailable') { throw "jiffshot-cli status: exit $LASTEXITCODE, $($reply | ConvertTo-Json -Compress)" }
          $global:LASTEXITCODE = 0
          if ('${{ github.event_name }}' -ne 'pull_request' -and -not [string]::IsNullOrWhiteSpace($env:SIGNING_ENVIRONMENT)) {
            foreach ($installedPath in @($exe, $cli, $hostDll)) {
              $sig = Get-AuthenticodeSignature -LiteralPath $installedPath
              if ($sig.Status -ne 'Valid' -or $null -eq $sig.SignerCertificate -or $null -eq $sig.TimeStamperCertificate) {
                throw "Installed binary signature verification failed for ${installedPath}: $($sig.StatusMessage)"
              }
            }
          }
          $product = @(Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' |
            Where-Object { $_.DisplayName -eq 'Devolutions Jiffshot' })
          if ($product.Count -ne 1) { throw 'Expected one Devolutions Jiffshot entry in Programs and Features' }
          if ($product[0].Publisher -ne 'Devolutions Inc.') { throw "Expected Publisher 'Devolutions Inc.', got '$($product[0].Publisher)'" }
          $installedVer = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
          if ($installedVer.ProductVersion -ne $product[0].DisplayVersion -or $installedVer.FileVersion -ne "$($product[0].DisplayVersion).0") {
            throw "Installed jiffshot.exe version ($($installedVer.FileVersion) / $($installedVer.ProductVersion)) does not match MSI DisplayVersion '$($product[0].DisplayVersion)'"
          }
          $open = (Get-ItemProperty "HKLM:\Software\Classes\jiffshot.Document\shell\open\command").'(default)'
          if ($open -notlike "*jiffshot.exe*") { throw "the .jsd association is wrong: $open" }
          Get-ChildItem "$env:ProgramFiles\Devolutions\Jiffshot" | Format-Table Name, Length
          Invoke-Msiexec "/x `"$msi`" /qn /l*v msiexec.log"
          if (Test-Path $exe) { throw "$exe is still there after uninstalling" }

      - uses: actions/upload-artifact@v7
        with:
          name: jiffshot-${{ matrix.rid }}-msi
          path: msi/*.msi
          if-no-files-found: error

  msix:
    name: ${{ matrix.rid }} MSIX
    environment:
      name: ${{ inputs.signing_environment || '' }}
    permissions:
      contents: read
      id-token: write
    needs: build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            architecture: x64
            test: true
          - rid: win-arm64
            architecture: arm64
            test: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: jiffshot-${{ matrix.rid }}
          path: bin

      - uses: actions/download-artifact@v8
        with:
          name: jiffshot-win-x64
          path: logo-bin

      - name: Build the MSIX
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
          PACKAGE_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          $ErrorActionPreference = 'Stop'
          $cargoToml = Get-Content -LiteralPath Cargo.toml -Raw
          if ($cargoToml -notmatch '(?ms)^\[workspace\.package\].*?^\s*version\s*=\s*"(?<v>[0-9]+\.[0-9]+\.[0-9]+)"') {
            throw 'Could not read [workspace.package] version from Cargo.toml'
          }
          $workspaceVersion = $Matches['v']
          $expectedVersion = if ([string]::IsNullOrWhiteSpace($env:EXPECTED_VERSION)) {
            $workspaceVersion
          } elseif ($env:EXPECTED_VERSION -ne $workspaceVersion) {
            throw "Input version '$env:EXPECTED_VERSION' does not match Cargo.toml '$workspaceVersion'"
          } else {
            $env:EXPECTED_VERSION
          }
          $stage = 'msix\stage'
          $assets = Join-Path $stage 'Assets'
          New-Item -ItemType Directory -Force -Path $assets | Out-Null
          $binaries = @(Get-ChildItem -LiteralPath bin -File |
            Where-Object { $_.Name -in @('jiffshot.exe', 'jiffshot-cli.exe') -or $_.Extension -eq '.dll' })
          if (-not ($binaries | Where-Object { $_.Name -eq 'jiffshot.exe' })) { throw 'jiffshot.exe is missing from the build artifact' }
          if (-not ($binaries | Where-Object { $_.Name -eq 'jiffshot-cli.exe' })) { throw 'jiffshot-cli.exe is missing from the build artifact' }
          if (-not ($binaries | Where-Object { $_.Name -eq 'rustolonia_host.dll' })) { throw 'rustolonia_host.dll is missing from the build artifact' }
          $binaries | Copy-Item -Destination $stage
          # Logo rendering is architecture-independent, but the ARM64 executable
          # cannot run on the x64 GitHub-hosted runner.
          $exe = (Resolve-Path 'logo-bin\jiffshot.exe').Path
          foreach ($logo in @(
            @{ Size = 150; Name = 'Square150x150Logo.png' },
            @{ Size = 44; Name = 'Square44x44Logo.png' },
            @{ Size = 50; Name = 'StoreLogo.png' }
          )) {
            $logoPath = Join-Path $assets $logo.Name
            $process = Start-Process -FilePath $exe `
              -ArgumentList @('--write-logo', [string]$logo.Size, "`"$logoPath`"") `
              -Wait -PassThru
            if ($process.ExitCode -ne 0 -or -not (Test-Path -LiteralPath $logoPath -PathType Leaf)) {
              throw "Failed to generate MSIX logo $($logo.Name)"
            }
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $exe
          $publisher = if ($signature.Status -eq 'Valid' -and $null -ne $signature.SignerCertificate) {
            $signature.SignerCertificate.Subject
          } else {
            'CN=Devolutions Jiffshot CI'
          }
          [xml]$manifest = Get-Content -LiteralPath package\AppxManifest.xml -Raw
          $namespace = [System.Xml.XmlNamespaceManager]::new($manifest.NameTable)
          $namespace.AddNamespace('appx', 'http://schemas.microsoft.com/appx/manifest/foundation/windows10')
          $identity = $manifest.SelectSingleNode('/appx:Package/appx:Identity', $namespace)
          if ($null -eq $identity) { throw 'Package identity is missing from package\AppxManifest.xml' }
          $identity.SetAttribute('Version', "$expectedVersion.0")
          $identity.SetAttribute('ProcessorArchitecture', $env:PACKAGE_ARCHITECTURE)
          $identity.SetAttribute('Publisher', $publisher)
          $manifest.Save((Join-Path $stage 'AppxManifest.xml'))
          $sdkBin = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          $makeAppx = Get-ChildItem -LiteralPath $sdkBin -Directory |
            Where-Object { Test-Path -LiteralPath (Join-Path $_.FullName 'x64\makeappx.exe') } |
            Sort-Object { [version]$_.Name } -Descending |
            Select-Object -First 1 |
            ForEach-Object { Join-Path $_.FullName 'x64\makeappx.exe' }
          if (-not $makeAppx) { throw "Windows SDK MakeAppx.exe was not found under $sdkBin" }
          $output = "msix\Devolutions.Jiffshot-$env:PACKAGE_ARCHITECTURE-$expectedVersion.msix"
          & $makeAppx pack /d $stage /p $output /o
          if ($LASTEXITCODE -ne 0) { throw "MakeAppx failed with exit code $LASTEXITCODE" }
          Get-Item -LiteralPath $output | Format-Table Name, Length

      - name: Sign MSIX
        if: github.event_name != 'pull_request' && inputs.signing_environment != ''
        uses: ./.github/actions/sign
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.TRUSTED_SIGNING_ACCOUNT_NAME }}
          TRUSTED_SIGNING_PROFILE_NAME: ${{ secrets.TRUSTED_SIGNING_PROFILE_NAME }}
          TRUSTED_SIGNING_TIMESTAMP_SERVER: ${{ vars.TRUSTED_SIGNING_TIMESTAMP_SERVER || 'http://timestamp.acs.microsoft.com/' }}
        with:
          install_test_signing_root: ${{ inputs.signing_environment == 'publish-test' }}
          files: msix/*.msix

      - name: Install and uninstall
        if: matrix.test && github.event_name != 'pull_request' && inputs.signing_environment != ''
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = if ([string]::IsNullOrWhiteSpace($env:EXPECTED_VERSION)) {
            if ((Get-Content -LiteralPath Cargo.toml -Raw) -notmatch '(?ms)^\[workspace\.package\].*?^\s*version\s*=\s*"(?<v>[0-9]+\.[0-9]+\.[0-9]+)"') {
              throw 'Could not read [workspace.package] version from Cargo.toml'
            }
            $Matches['v']
          } else {
            $env:EXPECTED_VERSION
          }
          $msix = "msix\Devolutions.Jiffshot-x64-$version.msix"
          Add-AppxPackage -Path $msix -ErrorAction Stop
          $installed = Get-AppxPackage -Name Devolutions.Jiffshot
          if ($null -eq $installed -or $installed.Version.ToString() -ne "$version.0") {
            throw "The installed Jiffshot MSIX does not match version $version"
          }
          if (-not (Test-Path -LiteralPath (Join-Path $installed.InstallLocation 'jiffshot.exe'))) {
            throw 'The installed MSIX does not contain jiffshot.exe'
          }
          $cli = Join-Path $installed.InstallLocation 'jiffshot-cli.exe'
          if (-not (Test-Path -LiteralPath $cli -PathType Leaf)) {
            throw 'The installed MSIX does not contain jiffshot-cli.exe'
          }
          $help = & $cli --help-agent
          if ($LASTEXITCODE -ne 0 -or -not ($help -match '^jiffshot-cli for AI agents$')) {
            throw "The installed jiffshot-cli.exe failed to run (exit $LASTEXITCODE)"
          }
          Remove-AppxPackage -Package $installed.PackageFullName -ErrorAction Stop
          if (Get-AppxPackage -Name Devolutions.Jiffshot) { throw 'Jiffshot MSIX is still installed after removal' }

      - uses: actions/upload-artifact@v7
        with:
          name: jiffshot-${{ matrix.rid }}-msix
          path: msix/*.msix
          if-no-files-found: error
