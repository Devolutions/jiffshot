name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Version to stamp and verify on built binaries; defaults to Cargo.toml
        type: string
        default: ''
      signing_environment:
        description: GitHub environment for signing; empty produces unsigned CI artifacts
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ${{ matrix.rid }}
    environment:
      name: ${{ inputs.signing_environment || '' }}
    permissions:
      contents: read
      id-token: write
    # win-arm64 is cross-built on x64 (Visual Studio's ARM64 tools are on the
    # image), so it is built but not run.
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            target: x86_64-pc-windows-msvc
            test: true
          - rid: win-arm64
            target: aarch64-pc-windows-msvc
            test: false
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        shell: pwsh
        run: |
          # rust-toolchain.toml selects the channel; rustup installs it here.
          rustup show
          rustup target add ${{ matrix.target }}
          cargo --version
          rustc --version

      - name: Cache Cargo and the Rustolonia host
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/AppData/Local/rustolonia/host
            target
          key: ${{ matrix.rid }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: ${{ matrix.rid }}-

      - name: Build
        env:
          JIFFSHOT_VERSION: ${{ inputs.version }}
        run: cargo build --release --locked -p jiffshot --target ${{ matrix.target }}

      - name: Test
        if: matrix.test
        env:
          JIFFSHOT_VERSION: ${{ inputs.version }}
        run: cargo test --release --locked --workspace --target ${{ matrix.target }}

      - name: Package
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          # The build script puts the Rustolonia host next to jiffshot.exe.
          $out = "target/${{ matrix.target }}/release"
          $dir = "jiffshot-${{ matrix.rid }}"
          New-Item -ItemType Directory -Path $dir | Out-Null
          Copy-Item "$out/jiffshot.exe", "$out/*.dll", "app/README-portable.txt" -Destination $dir
          $cargoToml = Get-Content -LiteralPath Cargo.toml -Raw
          if ($cargoToml -notmatch '(?ms)^\[workspace\.package\].*?^\s*version\s*=\s*"(?<v>[0-9]+\.[0-9]+\.[0-9]+)"') {
            throw 'Could not read [workspace.package] version from Cargo.toml'
          }
          $workspaceVersion = $Matches['v']
          $expectedVersion = if ([string]::IsNullOrWhiteSpace($env:EXPECTED_VERSION)) {
            $workspaceVersion
          } elseif ($env:EXPECTED_VERSION -ne $workspaceVersion) {
            throw "Input version '$env:EXPECTED_VERSION' does not match Cargo.toml '$workspaceVersion'"
          } else {
            $env:EXPECTED_VERSION
          }
          $expectedFileVersion = "$expectedVersion.0"
          $exeInfo = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path "$dir/jiffshot.exe"))
          if ($exeInfo.CompanyName -ne 'Devolutions Inc.') {
            throw "jiffshot.exe CompanyName '$($exeInfo.CompanyName)' does not match 'Devolutions Inc.'"
          }
          if ($exeInfo.ProductName -ne 'Devolutions Jiffshot') {
            throw "jiffshot.exe ProductName '$($exeInfo.ProductName)' does not match 'Devolutions Jiffshot'"
          }
          if ([string]::IsNullOrWhiteSpace($exeInfo.FileDescription)) {
            throw 'jiffshot.exe is missing FileDescription'
          }
          if ($exeInfo.OriginalFilename -ne 'jiffshot.exe') {
            throw "jiffshot.exe OriginalFilename '$($exeInfo.OriginalFilename)' does not match 'jiffshot.exe'"
          }
          if ($exeInfo.FileVersion -ne $expectedFileVersion) {
            throw "jiffshot.exe FileVersion '$($exeInfo.FileVersion)' does not match '$expectedFileVersion'"
          }
          if ($exeInfo.ProductVersion -ne $expectedVersion) {
            throw "jiffshot.exe ProductVersion '$($exeInfo.ProductVersion)' does not match '$expectedVersion'"
          }
          if ($cargoToml -notmatch 'rustolonia\s*=\s*\{[^}]*tag\s*=\s*"v(?<rv>[0-9]+\.[0-9]+\.[0-9]+)"') {
            throw 'Could not read rustolonia tag from Cargo.toml'
          }
          $rustoloniaVersion = $Matches['rv']
          $hostInfo = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path "$dir/rustolonia_host.dll"))
          if ($hostInfo.FileVersion -ne "$rustoloniaVersion.0") {
            throw "rustolonia_host.dll FileVersion '$($hostInfo.FileVersion)' does not match '$rustoloniaVersion.0'"
          }
          if (-not $hostInfo.ProductVersion.StartsWith($rustoloniaVersion)) {
            throw "rustolonia_host.dll ProductVersion '$($hostInfo.ProductVersion)' does not start with '$rustoloniaVersion'"
          }
          Write-Host "Version OK: jiffshot.exe FileVersion=$($exeInfo.FileVersion) ProductVersion=$($exeInfo.ProductVersion); rustolonia_host.dll FileVersion=$($hostInfo.FileVersion)"
          Get-ChildItem $dir | Format-Table Name, Length

      - name: Sign portable binaries
        if: github.event_name != 'pull_request' && inputs.signing_environment != ''
        uses: ./.github/actions/sign
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.TRUSTED_SIGNING_ACCOUNT_NAME }}
          TRUSTED_SIGNING_PROFILE_NAME: ${{ secrets.TRUSTED_SIGNING_PROFILE_NAME }}
          TRUSTED_SIGNING_TIMESTAMP_SERVER: ${{ vars.TRUSTED_SIGNING_TIMESTAMP_SERVER || 'http://timestamp.acs.microsoft.com/' }}
        with:
          install_test_signing_root: ${{ inputs.signing_environment == 'publish-test' }}
          files: |
            jiffshot-${{ matrix.rid }}\jiffshot.exe
            jiffshot-${{ matrix.rid }}\rustolonia_host.dll

      - uses: actions/upload-artifact@v7
        with:
          name: jiffshot-${{ matrix.rid }}
          path: jiffshot-${{ matrix.rid }}
          if-no-files-found: error

  msi:
    name: ${{ matrix.rid }} MSI
    environment:
      name: ${{ inputs.signing_environment || '' }}
    permissions:
      contents: read
      id-token: write
    needs: build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            platform: x64
            test: true
          - rid: win-arm64
            platform: arm64
            test: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: jiffshot-${{ matrix.rid }}
          path: bin

      - name: Install WiX 3.14
        shell: pwsh
        run: |
          choco install wixtoolset --version 3.14.0 --allow-downgrade --force --no-progress
          $wix = "${env:ProgramFiles(x86)}\WiX Toolset v3.14\bin"
          if (-not (Test-Path "$wix\light.exe")) { throw "WiX is not in $wix" }
          "WIXSHARP_WIXDIR=$wix" >> $env:GITHUB_ENV

      - name: Build the MSI
        shell: pwsh
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $cargoToml = Get-Content -LiteralPath Cargo.toml -Raw
          if ($cargoToml -notmatch '(?ms)^\[workspace\.package\].*?^\s*version\s*=\s*"(?<v>[0-9]+\.[0-9]+\.[0-9]+)"') {
            throw 'Could not read [workspace.package] version from Cargo.toml'
          }
          $expectedVersion = if ([string]::IsNullOrWhiteSpace($env:EXPECTED_VERSION)) {
            $Matches['v']
          } elseif ($env:EXPECTED_VERSION -ne $Matches['v']) {
            throw "Input version '$env:EXPECTED_VERSION' does not match Cargo.toml '$($Matches['v'])'"
          } else {
            $env:EXPECTED_VERSION
          }
          dotnet build package -c Release -p:Version=$expectedVersion
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $pkgExe = Resolve-Path 'package/bin/Release/net472/Jiffshot.Package.exe'
          $pkgInfo = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($pkgExe)
          if ($pkgInfo.CompanyName -ne 'Devolutions Inc.') {
            throw "Jiffshot.Package.exe CompanyName '$($pkgInfo.CompanyName)' does not match 'Devolutions Inc.'"
          }
          if ($pkgInfo.ProductName -ne 'Devolutions Jiffshot') {
            throw "Jiffshot.Package.exe ProductName '$($pkgInfo.ProductName)' does not match 'Devolutions Jiffshot'"
          }
          if ($pkgInfo.FileVersion -ne "$expectedVersion.0") {
            throw "Jiffshot.Package.exe FileVersion '$($pkgInfo.FileVersion)' does not match '$expectedVersion.0'"
          }
          if (-not $pkgInfo.ProductVersion.StartsWith($expectedVersion)) {
            throw "Jiffshot.Package.exe ProductVersion '$($pkgInfo.ProductVersion)' does not start with '$expectedVersion'"
          }
          & $pkgExe -bin bin -platform ${{ matrix.platform }} -version $expectedVersion -out msi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem msi | Format-Table Name, Length

      - name: Sign MSI
        if: github.event_name != 'pull_request' && inputs.signing_environment != ''
        uses: ./.github/actions/sign
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.TRUSTED_SIGNING_ACCOUNT_NAME }}
          TRUSTED_SIGNING_PROFILE_NAME: ${{ secrets.TRUSTED_SIGNING_PROFILE_NAME }}
          TRUSTED_SIGNING_TIMESTAMP_SERVER: ${{ vars.TRUSTED_SIGNING_TIMESTAMP_SERVER || 'http://timestamp.acs.microsoft.com/' }}
        with:
          install_test_signing_root: ${{ inputs.signing_environment == 'publish-test' }}
          files: msi\*.msi

      - name: Install and uninstall
        if: matrix.test
        shell: pwsh
        env:
          SIGNING_ENVIRONMENT: ${{ inputs.signing_environment }}
        run: |
          $msi = (Get-ChildItem msi/*.msi).FullName
          $exe = "$env:ProgramFiles\Devolutions\Jiffshot\jiffshot.exe"
          $hostDll = "$env:ProgramFiles\Devolutions\Jiffshot\rustolonia_host.dll"
          function Invoke-Msiexec($arguments) {
            $p = Start-Process msiexec.exe -ArgumentList $arguments -Wait -PassThru
            if ($p.ExitCode -ne 0) { Get-Content msiexec.log -Tail 50; throw "msiexec $arguments exited with $($p.ExitCode)" }
          }
          Invoke-Msiexec "/i `"$msi`" /qn /l*v msiexec.log"
          if (-not (Test-Path $exe)) { throw "$exe is missing" }
          if (-not (Test-Path $hostDll)) { throw "the Rustolonia host is missing" }
          if ('${{ github.event_name }}' -ne 'pull_request' -and -not [string]::IsNullOrWhiteSpace($env:SIGNING_ENVIRONMENT)) {
            foreach ($installedPath in @($exe, $hostDll)) {
              $sig = Get-AuthenticodeSignature -LiteralPath $installedPath
              if ($sig.Status -ne 'Valid' -or $null -eq $sig.SignerCertificate -or $null -eq $sig.TimeStamperCertificate) {
                throw "Installed binary signature verification failed for ${installedPath}: $($sig.StatusMessage)"
              }
            }
          }
          $product = @(Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' |
            Where-Object { $_.DisplayName -eq 'Devolutions Jiffshot' })
          if ($product.Count -ne 1) { throw 'Expected one Devolutions Jiffshot entry in Programs and Features' }
          if ($product[0].Publisher -ne 'Devolutions Inc.') { throw "Expected Publisher 'Devolutions Inc.', got '$($product[0].Publisher)'" }
          $installedVer = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($exe)
          if ($installedVer.ProductVersion -ne $product[0].DisplayVersion -or $installedVer.FileVersion -ne "$($product[0].DisplayVersion).0") {
            throw "Installed jiffshot.exe version ($($installedVer.FileVersion) / $($installedVer.ProductVersion)) does not match MSI DisplayVersion '$($product[0].DisplayVersion)'"
          }
          $open = (Get-ItemProperty "HKLM:\Software\Classes\jiffshot.Document\shell\open\command").'(default)'
          if ($open -notlike "*jiffshot.exe*") { throw "the .jsd association is wrong: $open" }
          Get-ChildItem "$env:ProgramFiles\Devolutions\Jiffshot" | Format-Table Name, Length
          Invoke-Msiexec "/x `"$msi`" /qn /l*v msiexec.log"
          if (Test-Path $exe) { throw "$exe is still there after uninstalling" }

      - uses: actions/upload-artifact@v7
        with:
          name: jiffshot-${{ matrix.rid }}-msi
          path: msi/*.msi
          if-no-files-found: error
