name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version matching Cargo.toml, without the v prefix (for example, 0.1.0)
        required: true
        type: string
      dry_run:
        description: Build, sign, and validate packages without creating a tag or release
        type: boolean
        default: true
      github_env:
        description: GitHub environment for Azure Trusted Signing
        required: false
        default: auto
        type: choice
        options:
          - auto
          - test
          - prod

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}-${{ inputs.dry_run && github.run_id || 'publish' }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.validate.outputs.version }}
      tag: ${{ steps.validate.outputs.tag }}
      signing_environment: ${{ steps.validate.outputs.signing_environment }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate version and release target
        id: validate
        shell: python
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
          REQUESTED_ENV: ${{ inputs.github_env }}
        run: |
          import os
          import re
          import subprocess
          import tomllib
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          dry_run = os.environ["DRY_RUN"] == "true"
          requested_environment = os.environ["REQUESTED_ENV"]
          if requested_environment not in ("auto", "test", "prod"):
              raise SystemExit("GitHub environment must be auto, test, or prod.")
          is_master = os.environ["GITHUB_REF"] == "refs/heads/master"
          if not re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", version):
              raise SystemExit("Version must be X.Y.Z without a v prefix or prerelease suffix.")
          if any(int(part) > limit for part, limit in zip(version.split("."), (255, 255, 65535))):
              raise SystemExit("Version exceeds Windows Installer limits (255.255.65535).")
          with open("Cargo.toml", "rb") as manifest:
              workspace_version = tomllib.load(manifest)["workspace"]["package"]["version"]
          if version != workspace_version:
              raise SystemExit(f"Requested version {version} does not match Cargo.toml ({workspace_version}).")
          tag = f"v{version}"
          if not dry_run:
              if not is_master:
                  raise SystemExit("Non-dry-run releases must run from master; use a dry run on other branches.")
              existing = subprocess.run(
                  ["git", "ls-remote", "--tags", "origin", f"refs/tags/{tag}"],
                  check=True, capture_output=True, text=True,
              )
              if existing.stdout.strip():
                  raise SystemExit(f"Tag {tag} already exists; release versions cannot be overwritten.")
          environment = "publish-test" if not is_master or requested_environment == "test" else "publish-prod"
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"version={version}\ntag={tag}\nsigning_environment={environment}\n")
          print(f"Version: {version}; tag: {tag}; signing environment: {environment}; dry run: {dry_run}")

  packages:
    name: Build, sign, and validate packages
    needs: preflight
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.preflight.outputs.version }}
      signing_environment: ${{ needs.preflight.outputs.signing_environment }}
    secrets: inherit

  test-signing-root:
    name: Retrieve test signing root
    if: ${{ needs.preflight.outputs.signing_environment == 'publish-test' }}
    needs: preflight
    runs-on: windows-latest
    environment:
      name: ${{ needs.preflight.outputs.signing_environment }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Azure login for Trusted Signing
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Retrieve and trust test signing root
        uses: ./.github/actions/trust-test-signing-root
        with:
          endpoint: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
          account_name: ${{ secrets.TRUSTED_SIGNING_ACCOUNT_NAME }}
          profile_name: ${{ secrets.TRUSTED_SIGNING_PROFILE_NAME }}
          certificate_path: ${{ runner.temp }}\artifact-signing-test-root.cer

      - uses: actions/upload-artifact@v7
        with:
          name: test-signing-root
          path: ${{ runner.temp }}\artifact-signing-test-root.cer
          if-no-files-found: error

  release:
    name: Collect artifacts and publish
    needs: [preflight, packages, test-signing-root]
    if: ${{ always() && needs.preflight.result == 'success' && needs.packages.result == 'success' && (needs.preflight.outputs.signing_environment == 'publish-prod' || needs.test-signing-root.result == 'success') }}
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
      SIGNING_ENVIRONMENT: ${{ needs.preflight.outputs.signing_environment }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: jiffshot-*
          path: artifacts

      - name: Download test signing root
        if: ${{ needs.preflight.outputs.signing_environment == 'publish-test' }}
        uses: actions/download-artifact@v8
        with:
          name: test-signing-root
          path: signing-root

      - name: Trust test signing root
        if: ${{ needs.preflight.outputs.signing_environment == 'publish-test' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $certificatePath = 'signing-root\artifact-signing-test-root.cer'
          if (-not (Test-Path -LiteralPath $certificatePath -PathType Leaf)) {
            throw "Missing test signing root: $certificatePath"
          }
          $certificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new(
            (Resolve-Path -LiteralPath $certificatePath).Path
          )
          $constraints = $certificate.Extensions |
            Where-Object { $_.Oid.Value -eq '2.5.29.19' } |
            Select-Object -First 1
          if ($null -eq $constraints -or -not $constraints.CertificateAuthority -or $certificate.Subject -ne $certificate.Issuer) {
            throw 'The downloaded Artifact Signing certificate is not a self-signed CA root.'
          }
          $storeLocation = 'Cert:\LocalMachine\Root'
          try {
            Import-Certificate -FilePath $certificatePath -CertStoreLocation $storeLocation | Out-Null
          }
          catch {
            $storeLocation = 'Cert:\CurrentUser\Root'
            Import-Certificate -FilePath $certificatePath -CertStoreLocation $storeLocation | Out-Null
          }
          $trustedRoot = Get-ChildItem $storeLocation |
            Where-Object { $_.Thumbprint -eq $certificate.Thumbprint } |
            Select-Object -First 1
          if ($null -eq $trustedRoot) { throw 'The Artifact Signing profile root was not installed.' }

      - name: Assemble release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path release | Out-Null
          foreach ($arch in @('x64', 'arm64')) {
            $portable = "artifacts\jiffshot-win-$arch"
            $msiName = "Devolutions.Jiffshot-$arch-$env:RELEASE_VERSION.msi"
            $msi = "artifacts\jiffshot-win-$arch-msi\$msiName"
            $msixName = "Devolutions.Jiffshot-$arch-$env:RELEASE_VERSION.msix"
            $msix = "artifacts\jiffshot-win-$arch-msix\$msixName"
            foreach ($required in @("$portable\jiffshot.exe", "$portable\jiffshot-cli.exe", "$portable\rustolonia_host.dll", "$portable\README-portable.txt", $msi, $msix)) {
              if (-not (Test-Path -LiteralPath $required -PathType Leaf)) { throw "Missing release file: $required" }
            }
            $signedTargets = @(
              Get-ChildItem -Path $portable -File |
                Where-Object { $_.Extension -in @('.exe', '.dll') } |
                ForEach-Object { $_.FullName }
            ) + @($msi, $msix)
            foreach ($path in $signedTargets) {
              $signature = Get-AuthenticodeSignature -LiteralPath $path
              if ($signature.Status -ne 'Valid' `
                  -or $null -eq $signature.SignerCertificate `
                  -or $null -eq $signature.TimeStamperCertificate) {
                throw "Invalid release signature or timestamp for ${path}: $($signature.StatusMessage)"
              }
            }
            $exeInfo = [System.Diagnostics.FileVersionInfo]::GetVersionInfo((Resolve-Path "$portable\jiffshot.exe"))
            if ($exeInfo.ProductVersion -ne $env:RELEASE_VERSION -or $exeInfo.FileVersion -ne "$env:RELEASE_VERSION.0") {
              throw "Release jiffshot.exe ($arch) version ($($exeInfo.FileVersion) / $($exeInfo.ProductVersion)) does not match $env:RELEASE_VERSION"
            }
            Copy-Item -LiteralPath $msi -Destination "release\$msiName"
            Copy-Item -LiteralPath $msix -Destination "release\$msixName"
            Compress-Archive -Path "$portable\*" `
              -DestinationPath "release\Devolutions.Jiffshot-$arch-$env:RELEASE_VERSION.zip"
          }
          pwsh -NoProfile -File package/linux/assemble-release.ps1 -ArtifactDir artifacts `
            -OutputDir release -Version "$env:RELEASE_VERSION"
          if ($LASTEXITCODE -ne 0) { throw 'Linux release assembly requires all six verified x64/ARM64 packages and their checksums.' }
          foreach ($arch in @('arm64', 'x86_64')) {
            $package = "artifacts\jiffshot-macos-$arch"
            $name = "Devolutions.Jiffshot-macos-$arch-$env:RELEASE_VERSION.dmg"
            $dmg = "$package\$name"
            $statusFile = "$package\signing.txt"
            foreach ($required in @($dmg, $statusFile)) {
              if (-not (Test-Path -LiteralPath $required -PathType Leaf)) { throw "Missing macOS release file: $required" }
            }
            $status = (Get-Content -LiteralPath $statusFile -Raw).Trim()
            if ($status -notin @('adhoc', 'signed', 'notarized')) { throw "Unknown macOS signing status: $status" }
            if ($env:DRY_RUN -ne 'true' -and $status -ne 'notarized') {
              throw "macOS $arch is $status; published releases require a signed and notarized disk image."
            }
            Write-Host "macOS $arch signing status: $status"
            Copy-Item -LiteralPath $dmg -Destination "release\$name"
          }
          Get-ChildItem release -File | Sort-Object Name | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content release\SHA256SUMS.txt -Encoding ascii
          Get-ChildItem release | Format-Table Name, Length

      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: release/*
          if-no-files-found: error

      - name: Create tag and GitHub Release
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $existing = git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to check the release tag.' }
          if ($existing) { throw "Tag $env:RELEASE_TAG already exists; refusing to overwrite it." }
          $assets = @(Get-ChildItem release -File | ForEach-Object { $_.FullName })
          gh release create "$env:RELEASE_TAG" @assets `
            --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" `
            --title "Devolutions Jiffshot $env:RELEASE_VERSION" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Failed to create the release and its tag.' }

      - name: Dry-run summary
        if: inputs.dry_run
        shell: pwsh
        run: |
          "Dry run completed for $env:RELEASE_TAG using $env:SIGNING_ENVIRONMENT. Signed Windows packages, six unsigned Linux x64/ARM64 tar.gz/DEB/RPM packages, two macOS disk images (unsigned when Apple credentials are unavailable), per-architecture Linux checksums, and SHA256SUMS.txt are in the release-assets artifact. No tag or GitHub Release was created." >> $env:GITHUB_STEP_SUMMARY
