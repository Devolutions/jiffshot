name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version matching Cargo.toml, without the v prefix (for example, 0.1.0)
        required: true
        type: string
      dry_run:
        description: Sign with publish-test and upload artifacts without creating a tag or release
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.validate.outputs.version }}
      tag: ${{ steps.validate.outputs.tag }}
      signing_environment: ${{ steps.validate.outputs.signing_environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate version and release target
        id: validate
        shell: python
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          import os
          import re
          import subprocess
          import tomllib
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"]
          dry_run = os.environ["DRY_RUN"] == "true"
          if not re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", version):
              raise SystemExit("Version must be X.Y.Z without a v prefix or prerelease suffix.")
          if any(int(part) > limit for part, limit in zip(version.split("."), (255, 255, 65535))):
              raise SystemExit("Version exceeds Windows Installer limits (255.255.65535).")
          with open("Cargo.toml", "rb") as manifest:
              workspace_version = tomllib.load(manifest)["workspace"]["package"]["version"]
          if version != workspace_version:
              raise SystemExit(f"Requested version {version} does not match Cargo.toml ({workspace_version}).")
          tag = f"v{version}"
          if not dry_run:
              if os.environ["GITHUB_REF"] != "refs/heads/master":
                  raise SystemExit("Production releases must run from master; use a dry run on other branches.")
              existing = subprocess.run(
                  ["git", "ls-remote", "--tags", "origin", f"refs/tags/{tag}"],
                  check=True, capture_output=True, text=True,
              )
              if existing.stdout.strip():
                  raise SystemExit(f"Tag {tag} already exists; release versions cannot be overwritten.")
          environment = "publish-test" if dry_run else "publish-prod"
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
              output.write(f"version={version}\ntag={tag}\nsigning_environment={environment}\n")
          print(f"Version: {version}; tag: {tag}; signing environment: {environment}; dry run: {dry_run}")

  packages:
    name: Build, sign, and validate packages
    needs: preflight
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/ci.yml
    with:
      signing_environment: ${{ needs.preflight.outputs.signing_environment }}
    secrets: inherit

  release:
    name: Collect artifacts and publish
    needs: [preflight, packages]
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.preflight.outputs.version }}
      RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: jiffshot-*
          path: artifacts

      - name: Assemble release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path release | Out-Null
          foreach ($arch in @('x64', 'arm64')) {
            $portable = "artifacts\jiffshot-win-$arch"
            $msiName = "Devolutions.Jiffshot-$arch-$env:RELEASE_VERSION.msi"
            $msi = "artifacts\jiffshot-win-$arch-msi\$msiName"
            foreach ($path in @("$portable\jiffshot.exe", "$portable\rustolonia_host.dll", $msi)) {
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing release file: $path" }
              $signature = Get-AuthenticodeSignature -LiteralPath $path
              if ($signature.Status -ne 'Valid' -or $null -eq $signature.TimeStamperCertificate) {
                throw "Invalid release signature or timestamp for ${path}: $($signature.StatusMessage)"
              }
            }
            Copy-Item -LiteralPath $msi -Destination "release\$msiName"
            Compress-Archive -Path "$portable\*" `
              -DestinationPath "release\Devolutions.Jiffshot-$arch-$env:RELEASE_VERSION-portable.zip"
          }
          Get-ChildItem release -File | Sort-Object Name | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content release\SHA256SUMS.txt -Encoding ascii
          Get-ChildItem release | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release/*
          if-no-files-found: error

      - name: Create tag and GitHub Release
        if: ${{ !inputs.dry_run }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $existing = git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Failed to check the release tag.' }
          if ($existing) { throw "Tag $env:RELEASE_TAG already exists; refusing to overwrite it." }
          $assets = @(Get-ChildItem release -File | ForEach-Object { $_.FullName })
          gh release create "$env:RELEASE_TAG" @assets `
            --repo "$env:GITHUB_REPOSITORY" --target "$env:GITHUB_SHA" `
            --title "Devolutions Jiffshot $env:RELEASE_VERSION" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Failed to create the release and its tag.' }

      - name: Dry-run summary
        if: inputs.dry_run
        shell: pwsh
        run: |
          "Dry run completed for $env:RELEASE_TAG. Signed packages and SHA256SUMS.txt are in the release-assets artifact. No tag or GitHub Release was created." >> $env:GITHUB_STEP_SUMMARY
