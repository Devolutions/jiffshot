[package]
name = "jiffshot-capture"
description = "Screen, window and region capture for Jiffshot"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
png.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_Graphics_Gdi"] }
windows-sys.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3.7", default-features = false, features = ["image-data", "wayland-data-control"] }
gstreamer = "0.24"
gstreamer-app = "0.24"
gstreamer-pbutils = "0.24"
gstreamer-video = { version = "0.24", features = ["v1_18"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
dispatch2.workspace = true
objc2.workspace = true
objc2-foundation.workspace = true
objc2-app-kit = { workspace = true, features = ["block2", "objc2-uniform-type-identifiers"] }
objc2-core-foundation.workspace = true
objc2-core-graphics.workspace = true
objc2-core-media.workspace = true
objc2-core-video.workspace = true
objc2-av-foundation = { workspace = true, features = ["objc2-core-media"] }
objc2-screen-capture-kit.workspace = true
objc2-vision.workspace = true
objc2-uniform-type-identifiers.workspace = true

[target.'cfg(any(windows, target_os = "macos", target_os = "linux"))'.dependencies]
image.workspace = true
tiny-skia.workspace = true
jiffshot-doc = { path = "../jiffshot-doc" }
