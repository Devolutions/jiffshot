[package]
name = "jiffshot-capture"
description = "Screen, window and region capture for Jiffshot"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
png.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_Graphics_Gdi"] }
windows-sys.workspace = true
image.workspace = true
tiny-skia.workspace = true
jiffshot-doc = { path = "../jiffshot-doc" }
