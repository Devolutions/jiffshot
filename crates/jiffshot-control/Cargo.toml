[package]
name = "jiffshot-control"
description = "Jiffshot's local control protocol between jiffshot-cli and the running Jiffshot"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Security_Authorization"] }

[target.'cfg(target_os = "macos")'.dependencies]
jiffshot-capture = { path = "../jiffshot-capture" }
libc.workspace = true
