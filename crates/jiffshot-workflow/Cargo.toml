[package]
name = "jiffshot-workflow"
description = "Jiffshot's capture side: tray, hotkeys, selection overlay, recording and the post-capture workflow"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
jiffshot-doc = { path = "../jiffshot-doc" }
tiny-skia.workspace = true
resvg = { version = "0.45", default-features = false }

[target.'cfg(windows)'.dependencies]
jiffshot-capture = { path = "../jiffshot-capture" }
jiffshot-control = { path = "../jiffshot-control" }
windows.workspace = true
windows-sys.workspace = true
